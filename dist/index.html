<!doctype html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solar Savings Calculator</title>
<meta name="description" content="See what solar would save on your power bill: system size, install cost, annual savings and payback, worked out on real New Zealand figures.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<!-- Config first, so the fonts named in it can start loading immediately. -->
<script>
/* ============================================================================
   CONFIG. THIS IS THE ONLY FILE YOU EDIT FOR A NEW CLIENT.
   Copy the whole project folder, change the values below, deploy. Done.
   Everything else (the NZ data, the maths, the design) is shared.
   ============================================================================ */

window.SOLAR_CONFIG = {

  /* --- The installer's details. Shown in the header and on the results page. --- */
  client: {
    name:     "Solar Colab",
    tagline:  "Servicing Napier, Hastings & Havelock North",
    phone:    "0800 726 522",
    email:    "",                       // Tim: fill in their enquiries address
    website:  "https://solarcolab.co.nz",

    // Their Webflow-hosted wordmark. Loads straight from their CDN, so it
    // stays in sync if they ever update it.
    logoUrl:     "https://cdn.prod.website-files.com/641b84915881276efe9a7512/6758fd65a6b5095e3fc7bf93_Solar%20Colab%20RGB%20Hero%20logo.Black.png",
    logoUrlDark: "",                    // A white/reversed logo for dark mode, if they have one.

    // Shown on the results page as the reason to trust the quote.
    proofPoint: "200+ solar arrays installed across Hawke's Bay, fitted by Isaac's Plumbing & Electrical, the region's electrical specialists for over 30 years.",

    // Is this installer SEANZ-accredited? ANZ and Kiwibank both require it
    // for their green loans, so this flips the finance card from a caveat
    // ("they require an accredited installer") into a selling point
    // ("we're accredited, so you're covered").
    // Solar Colab display the SEANZ member mark on their site.
    seanzAccredited: true
  },

  /* --- Their brand colour. -----------------------------------------------
     Solar Colab run golden yellow on warm charcoal and cream. Yellow is a
     FILL colour, not a text colour. Yellow text on a pale background is
     unreadable, so the page darkens it automatically wherever it needs to
     be read as text. You only set the fill.
     >>> Eyeballed off a screenshot of their site. If they have a brand
         guide with exact hex codes, drop them in here. <<<                */
  brand: {
    accent:     "#F4A81C",  // the fill: buttons, progress bar, chart, highlights
    accentDark: "#FDB833",  // slightly brighter, for dark mode
    onAccent:   "#2B2B2B"   // text sitting ON the yellow. Their site uses near-black.
  },

  /* --- Their fonts. ---------------------------------------------------------
     Any font on Google Fonts (fonts.google.com) works. Just type the family
     name exactly as it appears there. The page builds the load URL itself.

     Three roles:
       display: the big headings and the question text
       body:    everything else, including subheadings at the bold weight
       mono:    every number. Leave this alone unless you've a good reason;
                 a monospaced face is what makes the figures read like a
                 meter reading rather than marketing.

     If a client uses a licensed font that ISN'T on Google Fonts, put the
     stylesheet URL their foundry gives you in customCssUrl and name the
     family above. See README for how to handle a font supplied as files.  */
  fonts: {
    display: { family: "Baloo 2",       weights: [500, 600, 700] },
    body:    { family: "Inter",         weights: [400, 600, 700] },
    mono:    { family: "IBM Plex Mono", weights: [400, 500] },
    customCssUrl: ""
  },

  /* --- The map step. --------------------------------------------------------
     Shows the homeowner an aerial photo of their place and asks them to drag
     it so the pin sits on their roof.

     It does NOT make the estimate more accurate. Their power bill drives
     system size far more than the roof does. What it does do is make the tool
     feel like it's about their actual house, and it hands the installer an
     address and a set of coordinates with every lead, which is worth real
     money to them for quoting and routing.

     To turn it on you need a free LINZ Basemaps key from
     https://basemaps.linz.govt.nz (sign in, create a key, paste it below).
     Without a key the step quietly becomes a plain address box, so nothing
     breaks if you leave this off.                                          */
  address: {
    enabled: true,

    // Free from basemaps.linz.govt.nz. Leave blank to skip the imagery and
    // just collect a typed address.
    linzBasemapsKey: "",

    // The imagery tiles. {z}/{x}/{y} get filled in as the map moves, and
    // {key} is your key above. Only change this if LINZ change their URL
    // format or you want a different imagery set.
    tileUrlTemplate:
      "https://basemaps.linz.govt.nz/v1/tiles/aerial/WebMercatorQuad/{z}/{x}/{y}.webp?api={key}",
    attribution: "Imagery \u00a9 LINZ Basemaps, CC BY 4.0",

    // Where the map opens before they've found themselves. Set this to the
    // middle of the installer's patch. This is Napier.
    defaultCentre: { lat: -39.4928, lon: 176.9120, zoom: 13 },

    // The zoom we jump to once they've said "that's my place".
    roofZoom: 19,

    // Offer the "use my location" button. Phones handle this well and it
    // saves a lot of typing, but it does trigger a browser permission prompt.
    offerGeolocation: true,

    // Make them position the pin before continuing. Leave false. An address
    // is nice to have, and never worth losing a lead over.
    required: false
  },

  /* --- Region --- */
  region: {
    default: "hawkes-bay",
    // Set to true if this installer only services one region and you want to
    // skip the region question entirely (one less step = better conversion).
    // Solar Colab only service Hawke's Bay, so we skip the region question
    // entirely. One less step is one less place to lose a lead.
    lockToDefault: true
  },

  /* --- Where the lead goes. --- */
  leads: {
    // Paste the installer's GoHighLevel *Inbound Webhook* URL here.
    // GHL: Automation > Workflows > new workflow > trigger "Inbound Webhook" > copy URL.
    // Leave blank while testing. The form will still work and log to the browser console.
    webhookUrl: "",
    requirePhone: true
  },

  /* --- Ad tracking. Leave blank if not using. --- */
  tracking: {
    metaPixelId:      "",   // e.g. "1234567890"
    ga4MeasurementId: ""    // e.g. "G-XXXXXXXXXX"
  },

  /* --- Their own install pricing, if they've given it to you. ---
     Leave as null to use the shared NZ pricing table in nz-data.js.
     To override, copy the shape from NZ_SYSTEM_PRICING in nz-data.js. */
  pricingOverride: null,

  /* ==========================================================================
     ASSUMPTIONS. The numbers behind every figure the homeowner sees.
     These are the ones worth arguing about. Change a number here and every
     result on the page changes with it.
     ========================================================================== */
  assumptions: {

    // What a homeowner PAYS per unit of power, and what they GET paid for
    // power they export back to the grid. Buy rate is the NZ average; sell
    // rate is a typical solar-plan buyback.
    buyRatePerKwh:  0.2711,
    sellRatePerKwh: 0.17,

    // Daily fixed line charge. We subtract this before working out how many
    // units they actually use, otherwise we'd overestimate their usage.
    dailyFixedCharge: 1.80,

    // How fast power prices rise. NZ prices rose ~31% over the last 5 years,
    // which is about 5.5%/year. We deliberately use 3% so the savings figure
    // is conservative and defensible if a homeowner challenges it.
    electricityInflation: 0.03,

    // Panel hardware. 440W panels are the current standard; ~1.95m² each.
    panelWatts:   440,
    panelAreaM2:  1.95,

    // SELF-CONSUMPTION. The most important assumption in the whole tool.
    // Power used in the house as it's generated is worth the full 27c buy
    // rate. Power exported is worth 17c. So payback moves on this more than
    // on anything else.
    //
    // We DON'T size the system to cover their whole bill. A big power user
    // sized that way ends up with an oversized array exporting cheap power,
    // which makes payback worse, not better. Instead we size to what the
    // house can actually absorb during daylight, which is how installers
    // size in practice, and it lands us in the same place Solar Scout got
    // to on the same inputs.
    //
    // daytimeUsageShare: how much of a year's power gets used in daylight.
    // >>> Tim: these are my estimates. Confirm with Solar Colab. <<<
    daytimeUsageShare: {
      home:  0.45,   // someone home during the day
      mixed: 0.35,   // sometimes home
      out:   0.25    // out all day
    },

    // Solar output and household demand never line up perfectly. The sun
    // peaks at midday, the kettle doesn't. This discounts for that mismatch.
    solarLoadMatch: 0.85,

    // How much a roof loses compared to a perfect north-facing roof.
    orientationFactor: {
      north:    1.00,
      eastWest: 0.87,
      south:    0.65,
      // When they don't know, assume something between north and east-west
      // rather than the best case. Better to under-promise.
      unsure:   0.93
    },

    // Panels lose about 0.5% output per year.
    panelDegradationPerYear: 0.005,

    // Inverters don't last 25 years. Counting this makes the numbers honest
    // and is a good answer when a homeowner asks "what's the catch".
    inverterReplacement: { year: 13, cost: 2500 },

    // How far out we project savings.
    analysisYears: 25
  }
};

</script>
<script>
/* Turns the fonts block in config.js into a real Google Fonts request, and
   points the stylesheet's type variables at the chosen families. Kept inline
   and in the head so the fonts start downloading before anything renders. */
(function () {
  var f = (window.SOLAR_CONFIG || {}).fonts;
  if (!f) return;
  var roles = ["display", "body", "mono"];
  var families = [];

  roles.forEach(function (role) {
    var spec = f[role];
    if (!spec || !spec.family) return;
    var weights = (spec.weights && spec.weights.length) ? spec.weights : [400];
    families.push("family=" + spec.family.replace(/ /g, "+") +
                  ":wght@" + weights.join(";"));
  });

  if (families.length) {
    var link = document.createElement("link");
    link.rel = "stylesheet";
    link.href = "https://fonts.googleapis.com/css2?" + families.join("&") + "&display=swap";
    document.head.appendChild(link);
  }

  // A font the client licenses from somewhere other than Google Fonts.
  if (f.customCssUrl) {
    var custom = document.createElement("link");
    custom.rel = "stylesheet";
    custom.href = f.customCssUrl;
    document.head.appendChild(custom);
  }

  // Always keep a real fallback stack behind each family.
  var stacks = {
    display: '"Helvetica Neue", Arial, sans-serif',
    body:    '-apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif',
    mono:    'ui-monospace, SFMono-Regular, Menlo, monospace'
  };
  // Set these inline on <html>. A <style> injected here would sit ahead of
  // styles.css in the cascade and lose to its defaults.
  roles.forEach(function (role) {
    var spec = f[role];
    if (!spec || !spec.family) return;
    document.documentElement.style.setProperty(
      "--" + role, '"' + spec.family + '",' + stacks[role]);
  });
})();
</script>

<style>
/* ============================================================================
   NZ Solar Savings Calculator. Styles.
   Design: instrument panel. Cool paper, slate ink, one brand colour doing all
   the emphasis, and a fixed ochre used only for cautions. Every number is set
   in mono so figures read like a meter rather than marketing.

   To re-skin for a client you change brand.accent / brand.accentDark in
   config.js. Nothing in this file needs touching.
   ============================================================================ */

/* --- Tokens. Light is the base; dark redefines only these values. --------- */
:root {
  --paper:      #F5F3EF;
  --surface:    #FFFFFF;
  --surface-2:  #EBE7E0;
  --ink:        #2B2B2B;
  --ink-2:      #6B665F;
  --ink-3:      #9C958C;
  --line:       #DDD7CE;
  --line-soft:  #EAE5DD;

  /* --brand is a FILL. --brand-text is the same colour darkened until it can
     be read on --paper; app.js computes it, so a yellow brand still gives
     legible figures. --on-brand is the text that sits on top of the fill. */
  --brand:      #F4A81C;
  --brand-text: #8A5A00;
  --on-brand:   #2B2B2B;
  --brand-wash: #FBEFD8;

  /* Cautions. Deliberately a rust rather than an amber, so it never reads as
     the brand colour. */
  --flag:       #A85832;
  --flag-wash:  #F6E7E0;

  --shadow: 0 1px 2px rgba(43,43,43,.05), 0 8px 24px -12px rgba(43,43,43,.20);

  /* Defaults. The font loader in index.html overrides these with
     whatever is named in config.js. */
  --display: "Helvetica Neue", Arial, sans-serif;
  --body:    -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --mono:    ui-monospace, SFMono-Regular, Menlo, monospace;

  --step:  clamp(1rem, .8rem + .6vw, 1.25rem);
  --gutter: clamp(1.25rem, .9rem + 1.6vw, 2.5rem);
  --radius: 10px;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper:      #1F1E1C;
    --surface:    #2A2825;
    --surface-2:  #35322D;
    --ink:        #F1EEE8;
    --ink-2:      #A9A29A;
    --ink-3:      #79736B;
    --line:       #3E3A34;
    --line-soft:  #2F2C28;
    --brand:      #FDB833;
    --brand-text: #FDB833;
    --on-brand:   #2B2B2B;
    --brand-wash: #3A2E17;
    --flag:       #D98A63;
    --flag-wash:  #33231B;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"] {
  --paper:    #1F1E1C;
  --surface:  #2A2825;
  --surface-2:  #35322D;
  --ink:    #F1EEE8;
  --ink-2:    #A9A29A;
  --ink-3:    #79736B;
  --line:     #3E3A34;
  --line-soft:  #2F2C28;
  --brand:    #FDB833;
  --brand-text: #FDB833;
  --on-brand:   #2B2B2B;
  --brand-wash: #3A2E17;
  --flag:     #D98A63;
  --flag-wash:  #33231B;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.7);
}

* { box-sizing: border-box; }

/* display:grid on .stage would otherwise beat the hidden attribute. */
[hidden] { display: none !important; }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--body);
  font-size: var(--step);
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}

h1, h2 { font-family: var(--display); font-weight: 600; text-wrap: balance; margin: 0; letter-spacing: -.01em; }
h3, h4 { font-family: var(--body); font-weight: 600; text-wrap: balance; margin: 0; letter-spacing: -.005em; }
p { margin: 0; }
button { font: inherit; color: inherit; }

.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

.eyebrow {
  font-family: var(--mono);
  font-size: .7rem;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--ink-3);
}

:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; border-radius: 4px; }

/* --- Shell ---------------------------------------------------------------- */
.app { max-width: 1120px; margin: 0 auto; padding: 0 var(--gutter) 4rem; }

.masthead {
  display: flex; align-items: center; justify-content: space-between;
  gap: 1rem; padding: 1.25rem 0 1rem;
}
.brand { display: flex; align-items: center; gap: .7rem; min-width: 0; }
.brand img { height: 34px; width: auto; display: block; }
.brand-name { font-family: var(--display); font-weight: 600; font-size: 1.1rem; letter-spacing: -.01em; }
.brand-tag { color: var(--ink-3); font-size: .8rem; }
.masthead-phone {
  font-family: var(--mono); font-size: .82rem; color: var(--ink-2);
  text-decoration: none; white-space: nowrap;
}
.masthead-phone:hover { color: var(--brand-text); }

/* The progress rule doubles as the page's only horizontal division. */
.progress { height: 2px; background: var(--line); position: relative; overflow: hidden; }
.progress-fill {
  position: absolute; inset: 0 auto 0 0; width: 0;
  background: var(--brand); transition: width .45s cubic-bezier(.4,0,.2,1);
}

/* --- Two-column: recorded answers on the left, one question on the right -- */
.stage { display: grid; grid-template-columns: 244px 1fr; gap: clamp(1.5rem, 4vw, 3.5rem); padding-top: 2rem; }
@media (max-width: 800px) { .stage { grid-template-columns: 1fr; gap: 1.5rem; } }

/* --- The rail: answers accumulate here as meter readings ------------------ */
.rail { align-self: start; position: sticky; top: 1.5rem; }
.rail-title { margin-bottom: .9rem; }
.rail-list { display: flex; flex-direction: column; gap: 0; margin: 0; padding: 0; list-style: none; }
.rail-item {
  display: flex; flex-direction: column; gap: .1rem;
  padding: .55rem 0; border-bottom: 1px solid var(--line-soft);
  animation: reading-in .35s cubic-bezier(.2,.8,.3,1) both;
}
.rail-label { font-size: .72rem; color: var(--ink-3); letter-spacing: .02em; }
.rail-value { font-family: var(--mono); font-size: .88rem; font-variant-numeric: tabular-nums; }
.rail-empty { color: var(--ink-3); font-size: .82rem; line-height: 1.5; }

@keyframes reading-in { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: none; } }

@media (max-width: 800px) {
  .rail { position: static; }
  .rail-title { display: none; }
  .rail-list { flex-direction: row; gap: .45rem; overflow-x: auto; padding-bottom: .3rem; }
  .rail-item {
    flex: 0 0 auto; border: 1px solid var(--line); border-radius: 999px;
    padding: .3rem .7rem; background: var(--surface);
  }
  .rail-label { display: none; }
  .rail-value { font-size: .78rem; white-space: nowrap; }
  .rail-empty { display: none; }
}

/* --- The question panel --------------------------------------------------- */
.panel { min-width: 0; }
.question { animation: question-in .34s cubic-bezier(.2,.8,.3,1) both; }
@keyframes question-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

.question h2 { font-size: clamp(1.45rem, 1.15rem + 1.5vw, 2.1rem); line-height: 1.15; margin: .5rem 0 0; max-width: 20ch; }
.question-why { color: var(--ink-2); font-size: .92rem; margin-top: .7rem; max-width: 46ch; }

.options { display: grid; gap: .5rem; margin-top: 1.6rem; max-width: 34rem; }
.options.two-up { grid-template-columns: 1fr 1fr; }
@media (max-width: 520px) { .options.two-up { grid-template-columns: 1fr; } }

.option {
  display: flex; align-items: baseline; gap: .75rem; width: 100%; text-align: left;
  padding: .85rem 1rem; background: var(--surface);
  border: 1px solid var(--line); border-radius: var(--radius);
  cursor: pointer; transition: border-color .15s, background .15s, transform .1s;
}
.option:hover { border-color: var(--ink-3); }
.option:active { transform: translateY(1px); }
.option[aria-pressed="true"] { border-color: var(--brand); background: var(--brand-wash); }
.option-key {
  font-family: var(--mono); font-size: .68rem; color: var(--ink-3);
  flex: 0 0 auto; padding-top: .12rem;
}
.option[aria-pressed="true"] .option-key { color: var(--brand-text); }
.option-body { display: flex; flex-direction: column; gap: .1rem; min-width: 0; }
.option-label { font-weight: 500; line-height: 1.3; }
.option-note { font-size: .8rem; color: var(--ink-2); }

/* --- Bill slider ---------------------------------------------------------- */
.bill { margin-top: 1.6rem; max-width: 34rem; }
.bill-readout { font-family: var(--mono); font-size: clamp(2.6rem, 2rem + 3.5vw, 4rem); font-variant-numeric: tabular-nums; line-height: 1; letter-spacing: -.03em; }
.bill-readout span { font-size: .35em; color: var(--ink-3); letter-spacing: 0; margin-left: .3rem; }
.bill-slider { width: 100%; margin: 1.5rem 0 .4rem; accent-color: var(--brand); height: 24px; }
.bill-scale { display: flex; justify-content: space-between; font-family: var(--mono); font-size: .72rem; color: var(--ink-3); }


/* --- The map step ---------------------------------------------------------
   The pin sits fixed in the middle and the photo moves underneath it, which
   is far easier on a phone than dragging a small marker.                   */
.place { margin-top: 1.6rem; max-width: 34rem; display: flex; flex-direction: column; gap: .9rem; }
.place .field { max-width: none; }

.map {
  position: relative;
  height: clamp(260px, 42vw, 360px);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  overflow: hidden;
  background: var(--surface-2);
  cursor: grab;
  touch-action: none;          /* we handle the dragging ourselves */
  user-select: none;
}
.map.is-dragging { cursor: grabbing; }
.map.is-unavailable { display: none; }

.map-surface { position: absolute; inset: 0; }
.map-tile {
  position: absolute; top: 0; left: 0;
  width: 256px; height: 256px;
  will-change: transform;
  pointer-events: none;
}
.map-tile.is-missing { visibility: hidden; }

/* The pin. Sits dead centre, with a shadow so it reads against dark roofs
   and light driveways alike. */
.map-pin {
  position: absolute; left: 50%; top: 50%;
  width: 26px; height: 26px; margin: -30px 0 0 -13px;
  pointer-events: none;
  background: var(--brand);
  border: 2.5px solid #FFFFFF;
  border-radius: 50% 50% 50% 0;
  transform: rotate(-45deg);
  box-shadow: 0 2px 6px rgba(0,0,0,.45);
}
.map-pin::after {
  content: ""; position: absolute; inset: 0; margin: auto;
  width: 7px; height: 7px; border-radius: 50%; background: #FFFFFF;
}

.map-controls { position: absolute; top: 10px; right: 10px; display: flex; flex-direction: column; gap: 4px; }
.map-controls button {
  width: 32px; height: 32px; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink);
  border-radius: 6px; font-size: 1rem; line-height: 1; cursor: pointer;
  box-shadow: 0 1px 3px rgba(0,0,0,.2);
}
.map-controls button:hover { border-color: var(--ink-3); }

.map-credit {
  position: absolute; right: 0; bottom: 0;
  font-size: .62rem; padding: .2rem .45rem;
  background: rgba(255,255,255,.82); color: #2B2B2B;
  border-top-left-radius: 5px; pointer-events: none;
}

.place-note { font-size: .8rem; color: var(--ink-2); margin: 0; }
/* Flex column would otherwise stretch these full width. */
.place > .btn-link { align-self: flex-start; }

/* --- Buttons -------------------------------------------------------------- */
.actions { display: flex; align-items: center; gap: 1rem; margin-top: 2rem; flex-wrap: wrap; }
.btn {
  border: 1px solid transparent; border-radius: var(--radius);
  padding: .8rem 1.5rem; font-weight: 500; cursor: pointer;
  transition: filter .15s, transform .1s, border-color .15s;
}
.btn:active { transform: translateY(1px); }
.btn-primary { background: var(--brand); color: var(--on-brand); }
.btn-primary:hover { filter: brightness(1.08); }
.btn-primary[disabled] { opacity: .35; cursor: not-allowed; }
.btn-quiet { background: none; border-color: var(--line); color: var(--ink-2); }
.btn-quiet:hover { border-color: var(--ink-3); color: var(--ink); }
.btn-link { background: none; border: none; color: var(--ink-3); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; font-size: .85rem; padding: 0; }
.btn-link:hover { color: var(--ink); }

/* --- Contact form --------------------------------------------------------- */
.form { display: grid; gap: .75rem; margin-top: 1.6rem; max-width: 26rem; }
.field { display: flex; flex-direction: column; gap: .3rem; }
.field label { font-size: .78rem; color: var(--ink-2); }
.field input {
  font: inherit; font-size: .95rem; padding: .7rem .85rem;

/* Work out which region a dropped map pin sits in, by finding the nearest
   listed town. Several regions need more than one point: nearest-to-Dunedin

   number, and neighbouring regions have similar ones. Saving the question is
   worth more than the last few percent of precision.
   Only used when the map step is on and the installer covers more than one
   region. */
window.nzRegionFromCoords = function (lat, lon) {
  var best = null, bestDist = Infinity;
  window.NZ_REGIONS.forEach(function (r) {
    r.points.forEach(function (pt) {
      // Flat approximation, corrected for longitude converging toward the
      // pole. Plenty accurate over a country this size and far cheaper than
      // a proper great-circle distance.
      var dLat = pt[0] - lat;
      var dLon = (pt[1] - lon) * Math.cos(lat * Math.PI / 180);
      var d = dLat * dLat + dLon * dLon;
      if (d < bestDist) { bestDist = d; best = r; }
    });
  });
  return best;
};
